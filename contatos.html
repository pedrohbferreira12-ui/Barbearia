<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - Space For Men</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="contatos.css">
</head>

<body>

    <header>
        <div class="caixa">
            <h1><img src="./img/logo.png" alt="Logo"></h1>
            <nav>
                <ul>
                    <li> <a href="index.html">Home</a></li>
                    <li> <a href="produtos.html">Produtos</a></li>
                    <li> <a href="contatos.html">Contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <form action="">
            <label for="nomesobrenome">Nome e Sobrenome:</label>
            <input type="text" id="nomesobrenome" class="inputs-padrao">

            <label for="email">E-mail:</label>
            <input type="text" id="email" class="inputs-padrao">

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" class="inputs-padrao">

            <label for="mensagem">Mensagem</label>
            <textarea name="" id="mensagem" cols="67" rows="10"></textarea>

            <div>
                <p>Como prefere o nosso contato?</p>

                <label for="radio-email"><input type="radio" name="contato" id="radio-email">e-mail</label>

                <label for="radio-telefone"><input type="radio" name="contato" id="radio-telefone">telefone</label>

                <label for="radio-whatsapp"><input type="radio" name="contato" id="radio-whatsapp">whatsapp</label>

            </div>

            <label for="checkbox"><input type="checkbox" name="" id="checkbox">Gostaria de receber nossas novidades por
                e-mail?</label>

            <input type="submit" value="Enviar">
        </form>
    </main>

    <footer>
        <img src="./img/logo-branco.png" alt="logo-branco">
        <p class="copy">&#x00A9;Copyright Barbearia Space For Men</p>
    </footer>

</body>

</html>
